<app-page-shell
  title="จองบริการ"
  [backCommands]="profileBackCommands()"
  [backQueryParams]="profileBackQuery()"
>
  @if (loading()) {
    <p class="muted" style="text-align: center">กำลังโหลด…</p>
  } @else if (provider(); as p) {
    <div class="card">
      <h2 style="margin: 0; font-size: 18px">{{ p.name }}</h2>
    </div>

    @if (selectedService(); as svc) {
      <div class="card">
        <span class="badge b-blue">บริการที่จอง</span>
        <h3 style="margin: 8px 0 4px">{{ svc.title }}</h3>
        <p class="muted" style="margin: 0">{{ svc.categoryName ?? 'บริการทั่วไป' }}</p>
        <p class="price" style="margin: 8px 0 0; font-size: 16px">{{ formatPrice(svc.basePriceText) }}</p>
      </div>
    }

    <app-thai-datetime-field
      label="วันและเวลา"
      [value]="scheduledAt()"
      [requireFuture]="true"
      (valueChange)="scheduledAt.set($event)"
    />

    <label class="field">
      <span>สถานที่นัดหมาย <span class="req">*</span></span>
      <input
        class="input"
        placeholder="พิมพ์ที่อยู่ หรือเลือกจากแผนที่"
        [value]="addressText()"
        (input)="addressText.set($any($event.target).value)"
      />
      <button type="button" class="btn btn-secondary btn-sm" style="margin-top: 8px; width: fit-content" (click)="openPicker()">
        ปักหมุดจากแผนที่
      </button>
      @if (mapLat() !== null && mapLng() !== null) {
        <small class="muted">{{ mapLat()!.toFixed(5) }}, {{ mapLng()!.toFixed(5) }}</small>
      }
    </label>

    <label class="field">
      <span>หมายเหตุ</span>
      <textarea class="input" rows="3" [value]="note()" (input)="note.set($any($event.target).value)"></textarea>
    </label>

    @if (error()) {
      <p class="error-text">{{ error() }}</p>
    }
    <button
      class="btn btn-primary btn-block sticky-cta"
      type="button"
      [class.is-busy]="saving()"
      [disabled]="saving()"
      (click)="confirm()"
    >
      {{ saving() ? 'กำลังจอง…' : 'ยืนยันการจอง' }}
    </button>
  }

  <app-location-picker-modal
    [open]="pickerOpen()"
    heading="ปักหมุดจุดนัดหมาย"
    description="เลือกจุดที่ต้องการให้ผู้ให้บริการเข้าให้บริการ — อนุญาต GPS หรือเลือกเอง"
    locationTitle="จุดนัดหมาย"
    [lat]="pickerLat()"
    [lng]="pickerLng()"
    [autoLocateOnOpen]="autoLocateOnOpen()"
    [savedLocationReady]="mapLat() !== null && mapLng() !== null"
    [showRadius]="false"
    (confirm)="applyPickedLocation($event)"
    (cancel)="closePicker()"
  />

  <app-requester-bottom-nav />
</app-page-shell>
