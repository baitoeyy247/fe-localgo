<app-page-shell title="รีวิวงานจริง" backLink="/requester/appointment">
  <app-requester-flow-bar active="review" [unlockedThrough]="flowUnlockedThrough()" />
  <section class="screen">
    <div class="stack">
      <div class="summary-panel" [class.summary-panel--success]="canSubmit()">
        <span class="badge">{{ canSubmit() ? 'เสร็จสิ้น' : 'รอดำเนินงาน' }}</span>
        <h3>รีวิว {{ providerName() }}</h3>
        <p>รีวิวนี้เป็น verified review จากงานในระบบ</p>
        @if (statusHint()) {
          <p class="state-hint">{{ statusHint() }}</p>
        }
      </div>
      <div class="rating-picker" role="group" aria-label="ให้คะแนน">
        @for (star of [1, 2, 3, 4, 5]; track star) {
          <button
            type="button"
            class="rating-picker__star"
            [class.is-active]="rating() >= star"
            (click)="setRating(star)"
          >
            ★
          </button>
        }
      </div>
      <label class="form-area">
        <span>ความคิดเห็น</span>
        <textarea
          rows="3"
          placeholder="บอกประสบการณ์สั้น ๆ"
          [value]="comment()"
          (input)="comment.set($any($event.target).value)"
        ></textarea>
      </label>
      @if (error()) {
        <p class="error-text">{{ error() }}</p>
      }
      <button
        class="primary"
        type="button"
        [disabled]="submitting() || !canSubmit()"
        (click)="submit()"
      >
        {{ submitting() ? 'กำลังส่ง…' : 'ส่งรีวิวและกลับหน้าหลัก' }}
      </button>
    </div>
  </section>
  <app-requester-bottom-nav />
</app-page-shell>
