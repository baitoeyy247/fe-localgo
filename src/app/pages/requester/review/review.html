<app-page-shell title="รีวิวงานจริง" backLink="/requester/appointment">
  <app-requester-flow-bar active="review" [unlockedThrough]="flowUnlockedThrough()" />

  @if (loading()) {
    <app-skeleton-card [count]="2" />
  } @else {
    <div class="card">
      <span class="badge" [class.b-green]="canSubmit()" [class.b-gray]="!canSubmit()">{{
        canSubmit() ? 'เสร็จสิ้น' : 'รอดำเนินงาน'
      }}</span>
      <h3 style="margin: 8px 0 4px">รีวิว {{ providerName() }}</h3>
      <p class="muted" style="margin: 0">รีวิวนี้เป็นรีวิวที่ยืนยันแล้วจากงานในระบบ</p>
      @if (statusHint()) {
        <p class="muted" style="margin: 8px 0 0">{{ statusHint() }}</p>
      }
    </div>

    <div class="rating-picker stars big" role="group" aria-label="ให้คะแนน">
      @for (star of [1, 2, 3, 4, 5]; track star) {
        <button
          type="button"
          class="rating-picker__star"
          [class.is-active]="rating() >= star"
          (click)="setRating(star)"
        >
          ★
        </button>
      }
    </div>

    <label class="field">
      <span>ความคิดเห็น (ไม่บังคับ)</span>
      <textarea
        class="input"
        rows="3"
        placeholder="บอกประสบการณ์สั้น ๆ"
        [value]="comment()"
        (input)="comment.set($any($event.target).value)"
      ></textarea>
    </label>

    @if (error()) {
      <p class="error-text">{{ error() }}</p>
    }
    <button
      class="btn btn-primary btn-block"
      type="button"
      [disabled]="submitting() || !canSubmit() || rating() < 1"
      (click)="submit()"
    >
      {{ submitting() ? 'กำลังส่ง…' : 'ส่งรีวิวและกลับหน้าหลัก' }}
    </button>
  }

  <app-requester-bottom-nav />
</app-page-shell>
