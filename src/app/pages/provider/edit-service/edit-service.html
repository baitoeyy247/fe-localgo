<app-page-shell title="แก้ไขบริการ" backLink="/provider/manage">
  @if (loading()) {
    <app-skeleton-card variant="form" [count]="1" [topOffset]="true" />
  } @else if (loadError()) {
    <app-error-state (retry)="reload()" />
  } @else if (!service()) {
    <div class="state">
      <div class="em">🛠</div>
      <h3>ไม่พบบริการ</h3>
      <a class="btn btn-primary" routerLink="/provider/manage">กลับ</a>
    </div>
  } @else {
    @if (error()) {
      <p class="error-text">{{ error() }}</p>
    }
    <label class="field">
      <span>หมวดหมู่</span>
      <select class="input" [value]="selectedCategoryId()" (change)="selectCategory($any($event.target).value)">
        @for (cat of categories(); track cat.id) {
          <option [value]="cat.id" [selected]="selectedCategoryId() === cat.id">{{ cat.name }}</option>
        }
      </select>
    </label>
    <label class="field">
      <span>ชื่อบริการ <span class="req">*</span></span>
      <input class="input" [attr.maxlength]="LIMITS.serviceName" [value]="title()" (input)="title.set($any($event.target).value); touchForm()" />
      <app-char-counter [value]="title()" [max]="LIMITS.serviceName" label="ชื่อบริการ" />
    </label>
    <label class="field">
      <span>รายละเอียด</span>
      <textarea class="input" rows="3" [attr.maxlength]="LIMITS.serviceDescription" [value]="description()" (input)="description.set($any($event.target).value); touchForm()"></textarea>
      <app-char-counter [value]="description()" [max]="LIMITS.serviceDescription" label="รายละเอียดบริการ" />
    </label>
    <label class="field">
      <span>ราคาเริ่มต้น</span>
      <div class="input-with-unit">
        <input
          class="input-price"
          type="text"
          inputmode="numeric"
          maxlength="7"
          [class.err]="!!priceErr()"
          [value]="basePriceText()"
          (input)="basePriceText.set($any($event.target).value); priceErr.set(null); touchForm()"
          (blur)="checkPrice()"
        />
        <span class="input-with-unit__suffix">บาท</span>
      </div>
      @if (priceErr(); as msg) {
        <p class="error-text" role="alert">{{ msg }}</p>
      }
    </label>
    @for (branch of provider()!.branches; track branch.id) {
      @if (branch.isActive) {
        <label class="location-option branch-check" [class.location-option--selected]="isBranchSelected(branch.id)">
          <input type="checkbox" [checked]="isBranchSelected(branch.id)" (change)="toggleBranch(branch.id, $any($event.target).checked)" />
          <span>
            <strong>{{ branch.name }}</strong>
            <small>รัศมี {{ branch.serviceRadiusMeters / 1000 }} กม.</small>
          </span>
        </label>
      }
    }
    <button type="button" class="btn btn-primary btn-block" [class.is-busy]="saving()" [disabled]="saving() || !hasChanges()" (click)="askSave()">
      {{ saving() ? 'กำลังบันทึก…' : 'บันทึกการแก้ไข' }}
    </button>
    <button type="button" class="btn btn-danger-o btn-block" [disabled]="saving() || deleting()" (click)="deleteOpen.set(true)">
      ลบบริการ
    </button>
  }

  <app-confirm-save-dialog
    [saveOpen]="saveConfirmOpen()"
    [saveMessage]="saveConfirmMessage()"
    [saveBusy]="saving()"
    [discardOpen]="discardConfirmOpen()"
    (saveConfirm)="confirmSaveDialog()"
    (saveCancel)="cancelSaveDialog()"
    (discardConfirm)="cancelDiscardDialog()"
    (discardCancel)="cancelDiscardDialog()"
  />
  <app-confirm-sheet
    [open]="deleteOpen()"
    title="ลบบริการนี้?"
    [message]="deleteServiceConfirmMessage()"
    confirmLabel="ลบบริการ"
    [cancelLabel]="deleteDismissLabel"
    [danger]="true"
    [busy]="deleting()"
    (confirm)="deleteService()"
    (cancel)="deleteOpen.set(false)"
  />
  <app-provider-bottom-nav />
</app-page-shell>
