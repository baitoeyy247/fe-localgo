<app-page-shell title="แก้ไขบริการ" backLink="/provider/manage">
  @if (loading()) {
    <p class="muted" style="text-align: center">กำลังโหลด…</p>
  } @else if (!service()) {
    <div class="state">
      <div class="em">🛠</div>
      <h3>ไม่พบบริการ</h3>
      <a class="btn btn-primary" routerLink="/provider/manage">กลับ</a>
    </div>
  } @else {
    @if (error()) {
      <p class="error-text">{{ error() }}</p>
    }
    <label class="field">
      <span>หมวดหมู่</span>
      <select class="input" (change)="selectCategory($any($event.target).value)">
        @for (cat of categories(); track cat.id) {
          <option [value]="cat.id" [selected]="selectedCategoryId() === cat.id">{{ cat.name }}</option>
        }
      </select>
    </label>
    <label class="field">
      <span>ชื่อบริการ</span>
      <input class="input" [value]="title()" (input)="title.set($any($event.target).value)" />
    </label>
    <label class="field">
      <span>รายละเอียด</span>
      <textarea class="input" rows="3" [value]="description()" (input)="description.set($any($event.target).value)"></textarea>
    </label>
    <label class="field">
      <span>ราคาเริ่มต้น</span>
      <div class="input-with-unit">
        <input [value]="basePriceText()" (input)="basePriceText.set($any($event.target).value)" />
        <span class="input-with-unit__suffix">บาท</span>
      </div>
    </label>
    @for (branch of provider()!.branches; track branch.id) {
      @if (branch.isActive) {
        <label class="location-option" [class.location-option--selected]="isBranchSelected(branch.id)">
          <input type="checkbox" [checked]="isBranchSelected(branch.id)" (change)="toggleBranch(branch.id, $any($event.target).checked)" />
          <span>
            <strong>{{ branch.name }}</strong>
            <small>รัศมี {{ branch.serviceRadiusMeters / 1000 }} กม.</small>
          </span>
        </label>
      }
    }
    <button type="button" class="btn btn-primary btn-block" [disabled]="saving()" (click)="save()">
      {{ saving() ? 'กำลังบันทึก…' : 'บันทึกการแก้ไข' }}
    </button>
  }

  <app-provider-bottom-nav />
</app-page-shell>
