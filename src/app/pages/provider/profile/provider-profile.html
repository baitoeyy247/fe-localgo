<app-page-shell title="โปรไฟล์ผู้ให้บริการ" subtitle="ขั้นตอนที่ 1 จาก 3" backLink="/provider">
  <app-provider-setup-bar active="profile" />

  @if (loading()) {
    <app-skeleton-card variant="form" [count]="1" [topOffset]="true" />
  } @else {
    <label class="field" [class.field--error]="!!fieldErrors()['providerType']">
      <span>ประเภทผู้ให้บริการ <span class="req">*</span></span>
      <select
        class="input"
        aria-label="ประเภทผู้ให้บริการ"
        [value]="providerType()"
        (change)="selectProviderType($any($event.target).value)"
      >
        <option value="">-- เลือกประเภท --</option>
        @for (opt of typeOptions; track opt.value) {
          <option [value]="opt.value" [selected]="providerType() === opt.value">{{ opt.label }}</option>
        }
      </select>
      @if (fieldErrors()['providerType']; as msg) {
        <p class="error-text">{{ msg }}</p>
      }
    </label>
    <label class="field" [class.field--error]="!!fieldErrors()['name']">
      <span>ชื่อที่แสดง <span class="req">*</span></span>
      <input
        class="input"
        [class.err]="!!fieldErrors()['name']"
        [value]="name()"
        aria-label="ชื่อที่แสดง"
        placeholder="ชื่อร้าน / บริษัท / ชื่อเล่น"
        (input)="updateName($any($event.target).value)"
      />
      @if (fieldErrors()['name']; as msg) {
        <p class="error-text">{{ msg }}</p>
      }
    </label>
    <label class="field">
      <span>รายละเอียด</span>
      <textarea class="input" rows="3" [value]="description()" aria-label="รายละเอียด" (input)="updateDescription($any($event.target).value)"></textarea>
    </label>
    <label class="field">
      <span>LINE ติดต่อ</span>
      <input class="input" [value]="contactLineId()" aria-label="LINE" placeholder="@username" (input)="updateContactLine($any($event.target).value)" />
      <small class="muted">ใส่ LINE ID หรือ @username ที่ลูกค้าติดต่อได้ (ไม่บังคับ)</small>
    </label>
    <label class="field">
      <span>เบอร์โทร</span>
      <input class="input" [value]="contactPhone()" aria-label="เบอร์โทร" (input)="updateContactPhone($any($event.target).value)" />
    </label>
    @if (error()) {
      <p class="error-text">{{ error() }}</p>
    }
    <button class="btn btn-primary btn-block" type="button" [class.is-busy]="saving()" [disabled]="saving() || !hasChanges()" (click)="askSave()">
      {{ saving() ? 'กำลังบันทึก…' : 'บันทึกและตั้งพื้นที่' }}
    </button>
  }

  <app-confirm-save-dialog
    [saveOpen]="saveConfirmOpen()"
    [saveMessage]="saveConfirmMessage()"
    [saveBusy]="saving()"
    [discardOpen]="discardConfirmOpen()"
    (saveConfirm)="confirmSaveDialog()"
    (saveCancel)="cancelSaveDialog()"
    (discardConfirm)="cancelDiscardDialog()"
    (discardCancel)="cancelDiscardDialog()"
  />

  <app-provider-bottom-nav />
</app-page-shell>
