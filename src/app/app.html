<div class="app-shell">
  <app-offline-bar />
  <main class="app-main" [class.is-route-loading]="routeLoading()">
    @if (routeLoading()) {
      <div class="route-skeleton" aria-busy="true" aria-live="polite">
        <app-skeleton-card [count]="2" />
        <p class="muted" style="text-align: center">กำลังโหลดหน้า…</p>
      </div>
    }
    <div class="route-outlet">
      <router-outlet />
    </div>
  </main>
  <app-toast-host />
  <app-confirm-sheet
    [open]="dirty.discardPromptOpen()"
    title="ละทิ้งการเปลี่ยนแปลง?"
    message="ข้อมูลที่แก้ไขจะไม่ถูกบันทึก"
    confirmLabel="ละทิ้ง"
    cancelLabel="ยกเลิก"
    [danger]="true"
    (confirm)="dirty.resolveDiscard(true)"
    (cancel)="dirty.resolveDiscard(false)"
  />
</div>
