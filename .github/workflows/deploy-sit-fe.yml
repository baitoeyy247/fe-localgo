name: Deploy SIT Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Generate environment.sit.ts
        env:
          GITHUB_SHA: ${{ github.sha }}
          NG_APP_API_BASE_URL: ${{ secrets.SIT_API_BASE_URL }}
          NG_APP_LIFF_ID: ${{ secrets.SIT_LIFF_ID }}
          NG_APP_MAP_DEFAULT_LAT: ${{ secrets.SIT_MAP_DEFAULT_LAT }}
          NG_APP_MAP_DEFAULT_LNG: ${{ secrets.SIT_MAP_DEFAULT_LNG }}
          NG_APP_ALLOW_DEV_LOGIN: ${{ vars.NG_APP_ALLOW_DEV_LOGIN || 'false' }}
        run: node scripts/generate-fe-environment.mjs

      - name: Install and build
        run: |
          npm ci
          npm run build:sit

      - name: Absolutize asset paths
        run: node scripts/absolutize-assets.mjs dist/localgo/browser

      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@4 pages deploy dist/localgo/browser \
            --project-name=localgo-sit \
            --branch=main \
            --commit-dirty=true
